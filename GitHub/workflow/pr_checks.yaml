
# ─────────────────────────────────────────────────────────────
# .github/workflows/pr-checks.yml
# DisasterZero — Pull Request Quality Gates
# ─────────────────────────────────────────────────────────────

name: "🔍 PR Quality Gate"

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── PR Size Check ──
  pr-size:
    name: "📏 PR Size"
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const additions = pr.additions;
            const deletions = pr.deletions;
            const total = additions + deletions;

            let label = '';
            let emoji = '';
            if (total < 50) { label = 'size/XS'; emoji = '🟢'; }
            else if (total < 200) { label = 'size/S'; emoji = '🟢'; }
            else if (total < 500) { label = 'size/M'; emoji = '🟡'; }
            else if (total < 1000) { label = 'size/L'; emoji = '🟠'; }
            else { label = 'size/XL'; emoji = '🔴'; }

            console.log(`PR Size: +${additions} -${deletions} = ${total} (${label})`);

            // Add label
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [label],
              });
            } catch (e) {
              console.log('Could not add label:', e.message);
            }

            // Warn on large PRs
            if (total > 1000) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `${emoji} **Large PR detected** (+${additions} -${deletions} = ${total} lines)\n\nConsider breaking this into smaller PRs for easier review.`,
              });
            }

  # ── Conventional Commits ──
  commit-lint:
    name: "📝 Commit Messages"
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          echo "Checking commit messages follow conventional format..."
          COMMITS=$(git log --format="%s" origin/${{ github.base_ref }}..HEAD)

          VALID_PREFIXES="feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert"
          FAILED=0

          while IFS= read -r msg; do
            if [[ ! "$msg" =~ ^($VALID_PREFIXES)(\(.+\))?!?:\ .+ ]]; then
              echo "❌ Invalid: $msg"
              FAILED=1
            else
              echo "✅ Valid: $msg"
            fi
          done <<< "$COMMITS"

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "⚠️ Some commits don't follow conventional format."
            echo "Expected: type(scope): description"
            echo "Examples: feat(detector): add cluster termination detection"
            echo "          fix(recovery): handle timeout in S3 restore"
            # Warning only, not blocking
          fi

  # ── Coverage Diff ──
  coverage-check:
    name: "📊 Coverage Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest tests/unit/ tests/integration/ \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -q
        env:
          ENVIRONMENT: dev
          DATABRICKS_HOST: "https://mock-workspace.cloud.databricks.com"
          DATABRICKS_TOKEN: "dapi_mock_token"

      - name: Coverage report comment
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.80
          thresholdNew: 0.90
          thresholdModified: 0.80

